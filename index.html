<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flamaster2.Studio</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #042073;
        }

        ruffle-embed, ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "autoplay": "on",
            "splashScreen": false,
            "contextMenu": "off",
            "scale": "showAll",
            "letterbox": "on",
        };
    </script>
    <script src="ruffle.js"></script>
</head>
<body>
    <embed src="ui.swf" menu="false" quality="high" width="100%" height="100%" name="ui" align="middle" allowScriptAccess="sameDomain">
</body>
</html>
