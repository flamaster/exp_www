<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flamaster2.Studio</title>
    
    <!-- Dołączenie Ruffle z CDN -->
    <script src="ruffle.js"></script>

    <style>
        /* Usunięcie marginesów przeglądarki i rozciągnięcie na pełny ekran */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Ukrywa paski przewijania */
            background-color: #042073;
        }

        ruffle-embed, ruffle-player {
            display: block;
            width: 800px;
            height: 600px;
            background-color: #042073; 
          }
        
        embed, object {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Standardowy element embed z plikiem .swf -->
    <embed src="ui.swf" menu="false" quality="high" bgcolor="#042073" width="100%" height="100%" name="ui" align="middle" allowScriptAccess="sameDomain">

</body>
</html>
