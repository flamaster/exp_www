<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flamaster2.Studio</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #042073;
        }

        #player, ruffle-embed, ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
        }

        #unmute-button {
            position: absolute;
            left: 16px;
            bottom: 16px;
            z-index: 999;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
    
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "autoplay": "on",
            "splashScreen": false,
            "contextMenu": "off",
            "scale": "showAll",
            "letterbox": "on"
        };
    </script>
    <script src="ruffle.js"></script>
</head>
<body>
    <div id="player">
        <!-- start muted so browsers allow autoplay and avoid the browser "click to unmute" overlay -->
        <ruffle-embed id="ruffle" src="ui.swf" muted></ruffle-embed>
    </div>

    <button id="unmute-button">Włącz dźwięk</button>

    <script>
        const btn = document.getElementById('unmute-button');
        btn.addEventListener('click', () => {
            const container = document.getElementById('player');
            const newPlayer = document.createElement('ruffle-embed');
            newPlayer.src = 'ui.swf';
            newPlayer.id = 'ruffle';
            newPlayer.style.width = '100%';
            newPlayer.style.height = '100%';

            // Replace the muted player with a new one without the muted attribute.
            container.innerHTML = '';
            container.appendChild(newPlayer);

            // Hide the button after user gesture
            btn.style.display = 'none';
        });
    </script>
</body>
</html>
