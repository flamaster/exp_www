<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flamaster2.Studio</title>
    <style>
        /* Usunięcie marginesów przeglądarki i rozciągnięcie na pełny ekran */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Ukrywa paski przewijania */
            background-color: #042073;
        }

        ruffle-embed, ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #042073; 
          }
        
        embed, object {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
    <!-- Dołączenie Ruffle z CDN -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            // Wymusza automatyczny start (brak przycisku Play)
            "autoplay": "on",
            
            // Ukrywa ekran wczytywania i logo Ruffle
            "splashScreen": false,
            
            // Ukrywa pozycje Ruffle w menu pod prawym przyciskiem myszy
            "contextMenu": "off",

            "scale": "showAll",

            "letterbox": "on",
            
            // Opcjonalnie: wymuszenie tła
            "backgroundColor": "#042073"
        };
    </script>
    <script src="ruffle.js"></script>

    
</head>
<body>

    <embed src="ui.swf" width="100%" height="100%">
    
</body>
</html>
